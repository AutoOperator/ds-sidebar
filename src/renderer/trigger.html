<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Trigger</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #trigger-bar {
    width: 100%; height: 100%;
    background: #2563eb;
    border-radius: 3px;
    cursor: pointer;
    transition: filter 0.15s;
  }
  #trigger-bar:hover { filter: brightness(1.4); }
</style>
</head>
<body>
  <div id="trigger-bar"></div>
  <script>
    const bar = document.getElementById('trigger-bar');

    window.api.trigger.onConfig((config) => {
      if (config.color) bar.style.background = config.color;
    });

    bar.addEventListener('mouseenter', () => {
      window.api.trigger.mouseEnter();
    });

    bar.addEventListener('click', () => {
      window.api.trigger.mouseClick();
    });
  </script>
</body>
</html>
